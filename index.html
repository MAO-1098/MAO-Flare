<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>يلا بينا | دليل المسلة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- نافذة تسجيل الدخول والـ OTP -->
    <div id="authModal" class="fixed inset-0 bg-slate-950/90 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
            <h2 class="text-2xl font-black text-amber-400 text-center">🚀 يلا بينا!</h2>
            <p class="text-xs text-slate-400 text-center">سجل رقمك لمرة واحدة لاستكشاف خدمات دار السلام.</p>

            <form id="step1Form" class="space-y-3">
                <input type="tel" id="userPhoneInput" required pattern="^01[0-2,5]{1}[0-9]{8}$" placeholder="010xxxxxxxx" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white text-left" dir="ltr">
                <input type="text" id="userAreaInput" required placeholder="المنطقة (مثلاً: شارع الفتح)" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white">
                <button type="submit" class="w-full bg-amber-400 text-slate-950 font-bold py-3 rounded-xl">إرسال كود التحقق 💬</button>
            </form>

            <form id="step2Form" class="space-y-3 hidden">
                <div class="bg-amber-500/10 border border-amber-500/20 p-3 rounded-xl text-center">
                    <p class="text-xs text-amber-300">تم تجهيز كود التحقق الخاص بك!</p>
                    <a id="waOtpBtn" href="#" target="_blank" class="inline-block mt-2 bg-emerald-600 text-white text-xs font-bold px-4 py-2 rounded-lg">افتح واتساب للحصول على الكود 📲</a>
                </div>
                <input type="text" id="otpCodeInput" maxlength="4" required placeholder="----" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-center text-lg font-bold tracking-widest text-white" dir="ltr">
                <button type="submit" class="w-full bg-emerald-500 text-slate-950 font-bold py-3 rounded-xl">تأكيد الدخول ⚡</button>
            </form>
        </div>
    </div>

    <!-- نافذة اقتراح محل جديد (Input) -->
    <div id="addMerchantModal" class="fixed inset-0 bg-slate-950/90 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-sm w-full space-y-3 shadow-2xl">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-black text-amber-400">🏪 اقترح إضافة محل</h2>
                <button onclick="toggleModal('addMerchantModal', false)" class="text-slate-400">✕</button>
            </div>
            <form id="addMerchantForm" class="space-y-2">
                <input type="text" id="newShopName" required placeholder="اسم المحل أو النشاط" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                <input type="text" id="newShopCategory" required placeholder="التصنيف (مطاعم، صيدليات...)" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                <input type="text" id="newShopStreet" required placeholder="العنوان / الشارع" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                <input type="tel" id="newShopPhone" required placeholder="رقم الهاتف" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white text-left" dir="ltr">
                <button type="submit" class="w-full bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs">إرسال للمراجعة 📋</button>
            </form>
        </div>
    </div>

    <!-- نافذة الإبلاغ عن تلاعب (Input) -->
    <div id="reportModal" class="fixed inset-0 bg-slate-950/90 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-sm w-full space-y-3 shadow-2xl">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-black text-red-400">⚠️ إبلاغ عن تلاعب أو مشكلة</h2>
                <button onclick="toggleModal('reportModal', false)" class="text-slate-400">✕</button>
            </div>
            <form id="reportForm" class="space-y-2">
                <input type="hidden" id="reportShopName">
                <p id="reportShopLabel" class="text-xs text-slate-300 font-bold"></p>
                <textarea id="reportReason" rows="3" required placeholder="تفاصيل المشكلة (السعر غير صحيح، المحل مغلق...)" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white"></textarea>
                <button type="submit" class="w-full bg-red-500 text-white font-bold py-2.5 rounded-xl text-xs">إرسال البلاغ للأدمن 🚨</button>
            </form>
        </div>
    </div>

    <!-- الهيدر -->
    <header class="bg-slate-900/80 p-4 border-b border-slate-800 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black text-amber-400">يلا بينا <span class="text-xs text-slate-400 block font-normal">دليل المسلة</span></h1>
            <button onclick="toggleModal('addMerchantModal', true)" class="bg-amber-400/10 border border-amber-400/30 text-amber-400 text-xs px-3 py-1.5 rounded-xl font-bold">➕ اقترح محل</button>
        </div>
    </header>

    <!-- بانر الـ VIP (Output حي من قاعدة البيانات) -->
    <div id="vipBannerContainer" class="max-w-md mx-auto w-full p-4 hidden">
        <div class="bg-gradient-to-r from-amber-500 to-orange-600 rounded-2xl p-4 text-slate-950 shadow-xl relative overflow-hidden">
            <span class="bg-slate-950 text-amber-400 text-[10px] font-black px-2 py-0.5 rounded-md">إعلان VIP ⭐</span>
            <h3 id="vipTitleText" class="font-black text-base mt-2"></h3>
            <p id="vipDescText" class="text-xs mt-1 text-slate-900"></p>
        </div>
    </div>

    <!-- المحتوى الرئيسي (Output) -->
    <main class="max-w-md mx-auto p-4 w-full flex-grow space-y-4">
        <input type="text" id="searchInput" placeholder="ابحث عن نشاط أو شارع..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white">
        
        <div class="flex gap-2 overflow-x-auto pb-2" id="categoriesBar">
            <button onclick="filterCategory('all', this)" class="cat-btn bg-amber-400 text-slate-950 text-xs font-black px-4 py-2 rounded-xl whitespace-nowrap">الكل</button>
            <button onclick="filterTopTen(this)" class="cat-btn bg-slate-800 text-amber-400 border border-amber-500/30 text-xs font-bold px-4 py-2 rounded-xl whitespace-nowrap">🔥 الـ Top 10</button>
        </div>

        <div id="listingsContainer" class="space-y-3">
            <div class="text-center text-slate-400 py-10 text-sm">جاري تحميل البيانات... ⏳</div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://yyqhtxsysoypnruqegn.supabase.co";
        const SUPABASE_KEY = "حط_المفتاح_الخاص_بك_هنا";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let generatedOtp = "", tempPhone = "", tempArea = "", allMerchants = [];

        document.addEventListener("DOMContentLoaded", async () => {
            if (!localStorage.getItem("yalla_bina_phone")) document.getElementById("authModal").classList.remove("hidden");

            document.getElementById("step1Form").addEventListener("submit", (e) => {
                e.preventDefault();
                tempPhone = document.getElementById("userPhoneInput").value;
                tempArea = document.getElementById("userAreaInput").value;
                generatedOtp = Math.floor(1000 + Math.random() * 9000).toString();
                document.getElementById("waOtpBtn").href = `https://wa.me/2${tempPhone}?text=${encodeURIComponent(`كود التحقق الخاص بك في دليل المسلة هو: ${generatedOtp}`)}`;
                document.getElementById("step1Form").classList.add("hidden");
                document.getElementById("step2Form").classList.remove("hidden");
            });

            document.getElementById("step2Form").addEventListener("submit", async (e) => {
                e.preventDefault();
                if (document.getElementById("otpCodeInput").value === generatedOtp) {
                    await _supabase.from('users').insert([{ phone: tempPhone, area: tempArea }]);
                    localStorage.setItem("yalla_bina_phone", tempPhone);
                    document.getElementById("authModal").classList.add("hidden");
                    alert("تم التحقق بنجاح! أهلاً بك 🎉");
                } else {
                    alert("الكود غير صحيح.");
                }
            });

            document.getElementById("addMerchantForm").addEventListener("submit", async (e) => {
                e.preventDefault();
                const name = document.getElementById("newShopName").value;
                const category = document.getElementById("newShopCategory").value;
                const street = document.getElementById("newShopStreet").value;
                const phone = document.getElementById("newShopPhone").value;

                await _supabase.from('pending_merchants').insert([{ name, category, street, phone, status: 'pending' }]);
                alert("تم إرسال طلبك للمراجعة!");
                toggleModal('addMerchantModal', false);
                document.getElementById("addMerchantForm").reset();
            });

            document.getElementById("reportForm").addEventListener("submit", async (e) => {
                e.preventDefault();
                const shop_name = document.getElementById("reportShopName").value;
                const reason = document.getElementById("reportReason").value;
                const user_phone = localStorage.getItem("yalla_bina_phone") || "غير معروف";

                await _supabase.from('reports').insert([{ shop_name, reason, user_phone }]);
                alert("تم إرسال بلاغك للأدمن ومراجعته فوراً.");
                toggleModal('reportModal', false);
                document.getElementById("reportReason").value = "";
            });

            await fetchMerchants();
            document.getElementById("searchInput").addEventListener("input", (e) => renderListings(allMerchants, e.target.value));
        });

        function toggleModal(modalId, show) {
            const m = document.getElementById(modalId);
            if (show) m.classList.remove("hidden"); else m.classList.add("hidden");
        }

        function openReportModal(shopName) {
            document.getElementById("reportShopName").value = shopName;
            document.getElementById("reportShopLabel").innerText = `الإبلاغ عن: ${shopName}`;
            toggleModal('reportModal', true);
        }

        async function fetchMerchants() {
            const { data } = await _supabase.from('merchants').select('*');
            allMerchants = data || [];
            
            const vipShop = allMerchants.find(i => i.is_vip === true);
            if (vipShop && vipShop.vip_banner_title) {
                document.getElementById("vipBannerContainer").classList.remove("hidden");
                document.getElementById("vipTitleText").innerText = vipShop.vip_banner_title;
                document.getElementById("vipDescText").innerText = vipShop.vip_banner_desc || "";
            }

            renderListings(allMerchants, "");
        }

        function renderListings(list, query) {
            const container = document.getElementById("listingsContainer");
            let filtered = list.filter(i => i.name.toLowerCase().includes(query.toLowerCase()) || i.street.toLowerCase().includes(query.toLowerCase()));
            
            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 py-10 text-sm">مفيش نتائج مطابقة.. اقترح إضافته! 🛵</div>`;
                return;
            }

            container.innerHTML = filtered.map(item => `
                <div class="bg-slate-800/60 border ${item.is_top_ten ? 'border-amber-500/50' : 'border-slate-700/60'} rounded-2xl p-4 flex justify-between items-center relative">
                    ${item.is_top_ten ? '<span class="absolute -top-2 -right-2 bg-amber-400 text-slate-950 text-[9px] font-black px-2 py-0.5 rounded-full shadow">Top 10 ⭐</span>' : ''}
                    <div>
                        <h3 class="font-bold text-base text-white">${item.name}</h3>
                        <p class="text-xs text-slate-400 mt-1">📍 ${item.street}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="openReportModal('${item.name}')" class="text-slate-500 hover:text-red-400 text-xs px-1" title="إبلاغ">⚠️</button>
                        <a href="tel:${item.phone}" class="bg-amber-400 text-slate-950 p-2.5 rounded-xl font-bold text-sm">📞</a>
                    </div>
                </div>
            `).join('');
        }

        function filterTopTen(btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.className = "cat-btn bg-slate-800 text-slate-300 text-xs font-semibold px-4 py-2 rounded-xl whitespace-nowrap");
            btn.className = "cat-btn bg-amber-400 text-slate-950 text-xs font-black px-4 py-2 rounded-xl whitespace-nowrap";
            renderListings(allMerchants.filter(i => i.is_top_ten === true), "");
        }
    </script>
</body>
</html>
