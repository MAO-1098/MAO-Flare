<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فلير | أول منصة محلية ذكية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <!-- Header -->
    <header class="p-4 flex justify-between items-center glass sticky top-0 z-50">
        <div>
            <h1 class="text-xl font-extrabold bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">فلير ⚡ Flair</h1>
            <p class="text-[10px] text-slate-400">أول منصة محلية ذكية في دار السلام</p>
        </div>
        <button onclick="openModal('suggestModal')" class="text-xs bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-3 py-2 rounded-xl transition shadow-lg">➕ أضف محل</button>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">
        <!-- Search & Category Pills -->
        <div class="space-y-3">
            <input type="text" id="searchInput" placeholder="ابحث عن صيدلية، مطعم، سوبر ماركت..." oninput="filterData()"
                class="w-full bg-slate-900 border border-slate-800 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500 transition shadow-inner">
            <div class="flex gap-2 overflow-x-auto pb-1 text-xs">
                <button onclick="filterCat('all')" class="bg-amber-500 text-slate-950 px-3 py-1.5 rounded-xl font-bold shrink-0">الكل</button>
                <button onclick="filterCat('مطعم')" class="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl shrink-0">مطاعم 🍔</button>
                <button onclick="filterCat('صيدلية')" class="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl shrink-0">صيدليات 💊</button>
                <button onclick="filterCat('سوبر ماركت')" class="bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl shrink-0">بقالة 🛒</button>
            </div>
        </div>

        <!-- VIP Carousel Section -->
        <section>
            <h2 class="text-xs font-semibold text-amber-400 uppercase tracking-wider mb-3">👑 نخبة محلات دار السلام (VIP)</h2>
            <div id="vipCarousel" class="overflow-x-auto flex gap-4 pb-2 snap-x scrollbar-none"></div>
        </section>

        <!-- Offers Tab Section -->
        <section>
            <h2 class="text-xs font-semibold text-orange-400 uppercase tracking-wider mb-3">🔥 عروض وخصومات اليوم</h2>
            <div id="offersList" class="space-y-3"></div>
        </section>

        <!-- Main Directory List -->
        <section>
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">📍 دليل المحلات والخدمات</h2>
            <div id="merchantsList" class="space-y-3"></div>
        </section>
    </main>

    <!-- Suggest Modal -->
    <div id="suggestModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-6 space-y-4">
            <h3 class="text-lg font-bold text-amber-400">اقترح أو أضف محل جديد</h3>
            <input type="text" id="sName" placeholder="اسم المحل" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm">
            <input type="text" id="sCategory" placeholder="النشاط (مطعم، صيدلية...)" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm">
            <input type="text" id="sPhone" placeholder="رقم الاتصال والموبايل" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm">
            <input type="text" id="sAddress" placeholder="العنوان بالتفصيل + علامة مميزة" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm">
            <div class="flex gap-2 pt-2">
                <button onclick="submitSuggestion()" class="flex-1 bg-amber-500 text-slate-950 font-bold py-3 rounded-xl text-sm">إرسال الاقتراح</button>
                <button onclick="closeModal('suggestModal')" class="bg-slate-800 text-slate-300 px-4 py-3 rounded-xl text-sm">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://yyqhtxsysoyvpnruqegn.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_iJR-7HZ-7sbCJa_LW_GHHg_57gwd_hL";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allMerchants = [];
        let allOffers = [];

        async function initApp() {
            const mRes = await supabaseClient.from('merchants').select('*');
            const oRes = await supabaseClient.from('offers').select('*, merchants(name)');
            if(mRes.data) allMerchants = mRes.data;
            if(oRes.data) allOffers = oRes.data;
            renderUI(allMerchants, allOffers);
        }

        function renderUI(merchants, offers) {
            const vipContainer = document.getElementById('vipCarousel');
            const listContainer = document.getElementById('merchantsList');
            const offersContainer = document.getElementById('offersList');
            
            vipContainer.innerHTML = '';
            listContainer.innerHTML = '';
            offersContainer.innerHTML = '';

            // VIP
            merchants.filter(m => m.is_vip).forEach(m => {
                vipContainer.innerHTML += `
                    <div class="min-w-[220px] bg-gradient-to-br from-amber-500/20 to-slate-900 border border-amber-500/40 rounded-2xl p-4 snap-center shrink-0 flex flex-col justify-between">
                        <div>
                            <span class="bg-amber-500 text-slate-950 text-[10px] font-extrabold px-2 py-0.5 rounded-full">VIP ⭐</span>
                            <h3 class="font-bold text-base mt-2">${m.name}</h3>
                            <p class="text-xs text-slate-400 mt-1">${m.category} - ${m.landmark || m.address}</p>
                        </div>
                        <div class="flex gap-2 mt-4">
                            <a href="tel:${m.phone}" class="flex-1 bg-slate-800 text-center py-2 rounded-xl text-xs font-semibold">📞 اتصال</a>
                            <a href="https://wa.me/2${m.whatsapp || m.phone}" target="_blank" class="flex-1 bg-emerald-600 text-center py-2 rounded-xl text-xs font-semibold">💬 واتساب</a>
                        </div>
                    </div>`;
            });

            // Offers
            offers.forEach(o => {
                offersContainer.innerHTML += `
                    <div class="bg-gradient-to-r from-orange-500/10 to-slate-900 border border-orange-500/30 rounded-2xl p-4 flex justify-between items-center">
                        <div>
                            <span class="text-[10px] text-orange-400 font-bold">${o.merchants?.name || 'عرض مميز'}</span>
                            <h4 class="font-bold text-sm mt-0.5">${o.offer_title}</h4>
                            <p class="text-xs text-slate-400 mt-1">${o.offer_details || ''}</p>
                        </div>
                        <a href="https://wa.me/2" target="_blank" class="bg-orange-500 text-slate-950 p-2.5 rounded-xl text-xs font-bold shrink-0">احجز العرض</a>
                    </div>`;
            });

            // Normal Merchants
            merchants.filter(m => !m.is_vip).forEach(m => {
                listContainer.innerHTML += `
                    <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 flex justify-between items-center">
                        <div>
                            <div class="flex items-center gap-2">
                                <h3 class="font-bold text-sm">${m.name}</h3>
                                <span class="text-[10px] ${m.status ? 'text-emerald-400 bg-emerald-950/50' : 'text-rose-400 bg-rose-950/50'} px-2 py-0.5 rounded-full">${m.status ? '🟢 مفتوح' : '🔴 مغلق'}</span>
                            </div>
                            <p class="text-xs text-slate-400 mt-1">${m.category} | ${m.address} ${m.has_delivery ? ' | 🛵 يوفر دليفري' : ''}</p>
                        </div>
                        <div class="flex gap-2">
                            <a href="tel:${m.phone}" class="bg-slate-800 p-2.5 rounded-xl text-sm">📞</a>
                            <a href="https://wa.me/2${m.whatsapp || m.phone}" target="_blank" class="bg-emerald-600/20 text-emerald-400 p-2.5 rounded-xl text-sm">💬</a>
                        </div>
                    </div>`;
            });
        }

        function filterData() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allMerchants.filter(m => m.name.toLowerCase().includes(q) || m.category.toLowerCase().includes(q));
            renderUI(filtered, allOffers);
        }

        function filterCat(cat) {
            if(cat === 'all') { renderUI(allMerchants, allOffers); return; }
            const filtered = allMerchants.filter(m => m.category.includes(cat));
            renderUI(filtered, allOffers);
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        async function submitSuggestion() {
            const name = document.getElementById('sName').value;
            const category = document.getElementById('sCategory').value;
            const phone = document.getElementById('sPhone').value;
            const address = document.getElementById('sAddress').value;
            if(!name || !phone) { alert('من فضلك اكتب اسم المحل ورقم التليفون'); return; }
            await supabaseClient.from('community_submissions').insert([{ suggested_name: name, suggested_category: category, suggested_phone: phone, suggested_address: address }]);
            alert('تم إرسال اقتراحك بنجاح، شكراً لمساهمتك!');
            closeModal('suggestModal');
        }

        window.onload = initApp;
    </script>
</body>
</html>
