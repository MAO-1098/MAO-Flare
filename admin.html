<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة القيادة | فلير</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
    <header class="max-w-4xl mx-auto flex justify-between items-center pb-6 border-b border-slate-800">
        <h1 class="text-xl font-bold text-amber-400">⚡ الإدارة المركزية - فلير</h1>
        <button onclick="loadAdmin()" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl text-xs">🔄 تحديث البيانات</button>
    </header>

    <main class="max-w-4xl mx-auto mt-6 space-y-8">
        <section class="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4">
            <h2 class="text-sm font-bold text-amber-400 uppercase">📥 مقترحات المحلات المعلقة من الزوار</h2>
            <div id="subList" class="space-y-3"></div>
        </section>
    </main>

    <script>
        const SUPABASE_URL = "https://yyqhtxsysoyvpnruqegn.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_iJR-7HZ-7sbCJa_LW_GHHg_57gwd_hL";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadAdmin() {
            const { data } = await supabaseClient.from('community_submissions').select('*').eq('status', 'Pending');
            const box = document.getElementById('subList');
            box.innerHTML = '';

            if(!data || data.length === 0) { box.innerHTML = '<p class="text-xs text-slate-500">لا توجد اقتراحات معلقة حالياً.</p>'; return; }

            data.forEach(s => {
                box.innerHTML += `
                    <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-sm">${s.suggested_name}</h3>
                            <p class="text-xs text-slate-400">${s.suggested_category} - ${s.suggested_phone} - ${s.suggested_address}</p>
                        </div>
                        <button onclick="approve('${s.id}', '${s.suggested_name}', '${s.suggested_category}', '${s.suggested_phone}', '${s.suggested_address}')" class="bg-emerald-600 text-slate-950 px-3 py-2 rounded-xl text-xs font-bold">قبول وإضافة فورية</button>
                    </div>`;
            });
        }

        async function approve(id, name, category, phone, address) {
            await supabaseClient.from('merchants').insert([{ name, category, phone, address }]);
            await supabaseClient.from('community_submissions').update({ status: 'Approved' }).eq('id', id);
            alert('تم إضافته للدليل الرئيسي بنجاح!');
            loadAdmin();
        }

        window.onload = loadAdmin;
    </script>
</body>
</html>
